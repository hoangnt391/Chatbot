name: Build ASHNA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  windows:
    needs: frontend
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri -- icon assets/icon.svg
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ASHNA-Windows-EXE
          path: src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm install
      - run: npm run tauri -- android init
        env:
          CI: 'true'
      - run: npm run tauri -- icon assets/icon.svg
      - run: npm run tauri -- android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: ASHNA-Android-ARM64-Debug-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Prepare direct APK download
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' ! -name '*androidTest*')
          if [ "${#apks[@]}" -ne 1 ]; then
            printf 'Expected exactly one APK; found %s\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          mkdir -p release
          cp "${apks[0]}" release/ASHNA-AI-CHAT.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify release/ASHNA-AI-CHAT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ASHNA-Direct-APK
          path: release/ASHNA-AI-CHAT.apk
          if-no-files-found: error
  publish-android:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ashna-android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ASHNA-Direct-APK
          path: release
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-android.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" release/ASHNA-AI-CHAT.apk --target "$GITHUB_SHA" --title "ASHNA AI CHAT $VERSION Android" --notes "ARM64 debug APK. Internet required. Not an official Ashna application." --latest
          gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "ASHNA-AI-CHAT.apk") | .url'
          curl --fail --location --retry 3 --output /tmp/verified.apk "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/ASHNA-AI-CHAT.apk"
          cmp release/ASHNA-AI-CHAT.apk /tmp/verified.apk
